<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>渡らないで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;500;600&family=Cormorant:ital,wght@0,300;0,400;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070a;
    --forest:#0c120e;
    --forest-deep:#050805;
    --fog:#6d7268;
    --bone:#d9d3c6;
    --bone-dim:#8a8577;
    --blood:#3c0c0c;
    --blood-bright:#7a1616;
    --flash:#f2efe6;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    background:var(--void);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    font-family:'Cormorant', serif;
    color:var(--bone);
    height:100dvh;
    position:relative;
  }

  /* ---------- STAGE ---------- */
  .stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(20,26,20,0.55), rgba(5,7,5,0.95) 70%),
      linear-gradient(180deg, var(--forest) 0%, var(--forest-deep) 100%);
  }

  /* subtle forest texture lines (vertical trunks) drawn with CSS gradients */
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 2px,
        transparent 2px, transparent 38px),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px,
        transparent 1px, transparent 91px);
    opacity:0.5;
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* drifting fog */
  .fog{
    position:absolute;
    inset:-10%;
    background:
      radial-gradient(circle at 20% 80%, rgba(60,70,60,0.18), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(40,50,40,0.15), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(80,90,80,0.12), transparent 60%);
    animation: drift 22s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{
    0%{ transform:translate(-2%,0) scale(1); }
    100%{ transform:translate(2%,-1.5%) scale(1.06); }
  }

  /* ---------- FAR FIGURE (pre-jumpscare) ---------- */
  .figure-wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  .figure{
    width:38%;
    max-width:340px;
    min-width:150px;
    aspect-ratio:743/417;
    object-fit:cover;
    object-position:center 30%;
    filter: blur(7px) brightness(0.55) contrast(1.05) grayscale(0.25);
    opacity:0.38;
    transform:scale(1.02) translateY(2%);
    transition:
      filter 900ms cubic-bezier(.2,.9,.2,1),
      opacity 220ms ease-out,
      transform 900ms cubic-bezier(.2,.9,.2,1);
    will-change:filter, opacity, transform;
  }

  /* ---------- JUMPSCARE STATE ---------- */
  body.reveal .figure{
    width:100%;
    max-width:none;
    height:100dvh;
    aspect-ratio:auto;
    object-position:center 22%;
    filter: blur(0px) brightness(1) contrast(1.08) grayscale(0);
    opacity:1;
    transform:scale(1.08) translateY(0);
  }

  body.reveal .figure-wrap{ inset:0; }

  .flash{
    position:fixed;
    inset:0;
    background:var(--flash);
    opacity:0;
    pointer-events:none;
    z-index:30;
  }
  body.reveal .flash{
    animation: strobe 260ms steps(1,end) 1;
  }
  @keyframes strobe{
    0%{opacity:0;}
    8%{opacity:0.9;}
    20%{opacity:0.1;}
    35%{opacity:0.7;}
    55%{opacity:0;}
    100%{opacity:0;}
  }

  /* ---------- UI / DASHBOARD CHROME ---------- */
  .chrome{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    pointer-events:none;
    transition: opacity 500ms ease;
  }
  body.reveal .chrome{ opacity:0; }

  .row{ display:flex; justify-content:space-between; align-items:flex-start; }

  .mono{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--bone-dim);
    line-height:1.6;
  }
  .mono b{ color:var(--fog); font-weight:400; }

  .dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--blood-bright);
    margin-right:6px;
    box-shadow:0 0 6px var(--blood-bright);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }

  .center-copy{
    text-align:center;
    padding:0 24px;
  }

  .eyebrow{
    font-family:'Cormorant SC', serif;
    font-weight:500;
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--bone-dim);
    margin-bottom:14px;
  }

  h1{
    font-weight:300;
    font-style:italic;
    font-size:clamp(28px, 7vw, 52px);
    letter-spacing:0.01em;
    color:var(--bone);
    text-shadow:0 0 30px rgba(0,0,0,0.8);
  }

  .subline{
    margin-top:14px;
    font-size:clamp(13px, 3vw, 16px);
    color:var(--bone-dim);
    font-style:italic;
    max-width:34ch;
    margin-left:auto;
    margin-right:auto;
  }

  .bottom-readout{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }

  .bar-track{
    width:120px;
    height:2px;
    background:rgba(255,255,255,0.08);
    margin-top:8px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:var(--fog);
    animation: fillbar 2000ms linear forwards;
  }
  @keyframes fillbar{ to{ width:100%; } }

  /* ---------- POST-REVEAL LABEL ---------- */
  .post{
    position:fixed;
    left:0;right:0;
    bottom:max(28px, env(safe-area-inset-bottom));
    z-index:20;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 700ms ease 300ms;
  }
  body.reveal .post{
    opacity:1;
    pointer-events:auto;
  }
  .post .mono{ color:var(--bone-dim); }
  .replay{
    margin-top:10px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--bone);
    background:rgba(5,5,5,0.55);
    border:1px solid rgba(255,255,255,0.18);
    padding:9px 18px;
    border-radius:2px;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .replay:active{ background:rgba(255,255,255,0.08); }

  /* vignette always on top, keeps edges dark on any screen ratio */
  .vignette{
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
    box-shadow: inset 0 0 18vw 4vw rgba(0,0,0,0.85);
  }

  @media (prefers-reduced-motion: reduce){
    .fog, .dot, .bar-fill{ animation:none !important; }
    .figure, .chrome{ transition-duration:400ms !important; }
    body.reveal .flash{ animation:none !important; }
  }
</style>
</head>
