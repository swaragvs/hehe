<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ed">
  <title>Tata Bye Bye</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24211f;
      --muted: #746d67;
      --paper: #fffdf9;
      --peach: #ffb38a;
      --yellow: #ffd86b;
      --mint: #bcebd7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 216, 107, .55), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(188, 235, 215, .7), transparent 30%),
        #fff7ed;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 8vw, 72px) clamp(24px, 7vw, 64px);
      text-align: center;
      background: rgba(255, 253, 249, .9);
      border: 2px solid var(--ink);
      border-radius: 24px;
      box-shadow: 10px 10px 0 var(--ink);
      animation: arrive .6s ease-out both;
    }

    .sticker {
      display: inline-grid;
      width: 86px;
      height: 86px;
      place-items: center;
      margin-bottom: 24px;
      font-size: 46px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 50%;
      transform: rotate(-8deg);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: 'Trebuchet MS', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 76px);
      line-height: .95;
      letter-spacing: -.04em;
    }

    .subtitle {
      max-width: 32ch;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 22px);
      line-height: 1.45;
    }

    .meme {
      display: inline-block;
      margin: 32px 0 0;
      padding: 13px 18px;
      color: var(--ink);
      font-family: 'Trebuchet MS', sans-serif;
      font-size: clamp(13px, 2.4vw, 16px);
      font-weight: 700;
      line-height: 1.35;
      background: var(--mint);
      border: 2px solid var(--ink);
      border-radius: 12px;
      transform: rotate(1.5deg);
    }

    .signoff {
      margin: 30px 0 0;
      font-family: 'Trebuchet MS', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(16px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="sticker" aria-hidden="true">👋</div>
    <p class="eyebrow">Official announcement</p>
    <h1>Tata Bye Bye<br>Khatam.</h1>
    <p class="subtitle">The show is over, the snacks are finished, and everyone may now go home peacefully.</p>
    <p class="meme">Me: “I’ll leave after one last thing.”<br>Also me, 47 minutes later: bye.</p>
    <p class="signoff">Thanks for stopping by</p>
  </main>
</body>
</html>
